name: Mini Projects CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  kv-store-cpp:
    name: Build & Test kv-store (C++17) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S kv-store

      - name: Build C++ Targets
        run: cmake --build build --config Release

      - name: Run kv-store Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

  kv-store-sanitizers:
    name: ASan & UBSan Memory Verification (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake with Sanitizers
        run: cmake -B build-san -S kv-store -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build with Sanitizers
        run: cmake --build build-san

      - name: Run Sanitized Test Suite
        run: ctest --test-dir build-san --output-on-failure

  python-mini-projects:
    name: Test & Lint Python Projects (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONPATH: ${{ github.workspace }}/url-shortener:${{ github.workspace }}/rate-limiter:${{ github.workspace }}/task-queue

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest fastapi httpx uvicorn

      - name: Lint Codebase (flake8)
        run: |
          flake8 url-shortener rate-limiter task-queue \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Monorepo Tests (All 25 tests)
        run: pytest -v
